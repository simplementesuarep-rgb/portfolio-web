<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simplemente Suarep</title>
  <meta name="description" content="Multimedia and graphic designer, photographer and cinematographer. Experimental and conceptual work.">
  <meta name="theme-color" content="#ffffff">

  <link rel="preload" href="assets/fonts/MonaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body data-scroll="infinite">

  <div class="loader" aria-hidden="true">
    <div class="loader__stage">
      <p class="loader__name">
        <span class="loader__word">Simplemente</span>
        <span class="loader__word">Suarep</span>
      </p>
      <p class="loader__count">0</p>
    </div>
  </div>

  <header class="nav grid">
    <a class="nav__link nav__link--contact" data-ink data-ink-hover href="#contact">Contact</a>
    <a class="nav__link nav__link--works" data-ink data-ink-hover href="#works">Works,</a>
    <button class="nav__link nav__link--sound" data-ink data-ink-hover type="button" aria-pressed="false">Sound</button>
  </header>

  <main>
    <!-- Home: fotos pegadas entre sí en las dos columnas centrales; el scroll es infinito -->
    <section class="gallery gallery--center" aria-label="Selected work">
      <figure class="photo photo--portrait" data-cursor="View">
        <picture>
          <source type="image/avif" sizes="calc(50vw - 25px)" srcset="assets/img/3-640.avif 640w,
              assets/img/3-1280.avif 1280w,
              assets/img/3-2000.avif 2000w">
          <source type="image/webp" sizes="calc(50vw - 25px)" srcset="assets/img/3-640.webp 640w,
              assets/img/3-1280.webp 1280w,
              assets/img/3-2000.webp 2000w">
          <img src="assets/img/3-1280.webp" width="2000" height="3000" alt="Person in a fur hat in strong light, almost in silhouette" fetchpriority="high" decoding="async">
        </picture>
      </figure>

      <figure class="photo photo--portrait" data-cursor="View">
        <picture>
          <source type="image/avif" sizes="calc(50vw - 25px)" srcset="assets/img/4-640.avif 640w,
              assets/img/4-1280.avif 1280w,
              assets/img/4-2000.avif 2000w">
          <source type="image/webp" sizes="calc(50vw - 25px)" srcset="assets/img/4-640.webp 640w,
              assets/img/4-1280.webp 1280w,
              assets/img/4-2000.webp 2000w">
          <img src="assets/img/4-1280.webp" width="2000" height="3000" alt="Person wrapped in patched denim fabric, hiding half of their face" loading="lazy" decoding="async">
        </picture>
      </figure>
    </section>
  </main>

  <footer class="footer">
    <nav class="footer__links" aria-label="Social">
      <a class="footer__link footer__link--linkedin" data-ink-hover href="#" target="_blank" rel="noopener">LinkedIn</a>
      <a class="footer__link footer__link--instagram" data-ink-hover href="#" target="_blank" rel="noopener">Instagram</a>
    </nav>
    <p class="footer__name">
      <span class="footer__word" data-ink>Simplemente</span>
      <span class="footer__word" data-ink>Suarep</span>
    </p>
  </footer>

  <div class="cursor-tag" aria-hidden="true"></div>

</body>
</html>
